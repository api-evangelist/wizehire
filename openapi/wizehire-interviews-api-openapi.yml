openapi: 3.2.0
info:
  title: Scout Service Interviews API
  description: Backend service for the Scout Chrome Extension — AI-powered recruiting assistant
  version: 0.1.0
tags:
- name: Interviews
paths:
  /v1/interviews/schedule:
    post:
      tags:
      - Interviews
      summary: Schedule Interview
      description: 'Schedule an interview on behalf of the authenticated user.


        Proxies the request to ATS, positioning Scout Service as the

        intermediary for interview scheduling.'
      operationId: schedule_interview_v1_interviews_schedule_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInterviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    InterviewType:
      type: string
      enum:
      - phone
      - video
      - in_person
      title: InterviewType
    ScheduleInterviewRequest:
      properties:
        apply_id:
          type: integer
          title: Apply Id
        interview_type:
          $ref: '#/components/schemas/InterviewType'
      type: object
      required:
      - apply_id
      - interview_type
      title: ScheduleInterviewRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
