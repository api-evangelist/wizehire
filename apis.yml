aid: wizehire
name: WizeHire
description: Wizehire is a Houston, Texas hiring platform for small and mid-size businesses that combines
  an applicant tracking system with AI candidate matching (Talent Match), an AI recruiting assistant delivered
  as a Chrome extension (Scout), DISC+ personality and skills assessments, candidate texting, interview
  scheduling, expert human hiring coaches, and employee onboarding. Job posts syndicate to 100+ boards
  including Indeed, LinkedIn and ZipRecruiter, and the platform connects to HRIS, payroll, background-check
  and e-signature systems — ADP Workforce Now, RUN Powered by ADP, Ceridian Dayforce, Gusto, Paychex,
  Paycor, Paylocity, UKG, QuickBooks, Checkr and Dropbox Sign — plus Zapier and real-estate CRMs via a
  customer-issued API key. Wizehire serves real estate, insurance, dental, legal, automotive and hospitality
  operators, and publishes an NYC Local Law 144 AEDT bias audit for its automated employment decision
  tooling.
