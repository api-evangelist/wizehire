apis:
- name: Wizehire Scout Service API
  description: 'Backend service for the Wizehire Scout Chrome extension — the AI recruiting assistant. Five operations
    over HTTP Bearer auth: a streaming (Server-Sent Events) agent chat endpoint that runs a LangGraph-backed recruiting
    agent with human-in-the-loop resume support, top-candidate retrieval by fit score for a job, single-application
    detail lookup, and interview scheduling proxied through to the Wizehire ATS. Published as OpenAPI 3.1.0 at the
    service host root.'
